<div id="classic-console" hidden aria-label="Game console">
  <div class="console-fill"></div>
  <img id="console-left" alt=""><img id="console-center" alt=""><img id="console-right" alt="">
  <button id="minimap-terrain" type="button" aria-label="Minimap terrain" aria-pressed="true" title="Hide minimap terrain (Tab)"></button>
  <div id="minimap-slot"><canvas id="classic-minimap" width="128" height="128" aria-label="Minimap: tap or drag to move camera; hold to command"></canvas></div>
  <div id="unit-preview" title="Unit portrait"><canvas id="unit-portrait" hidden width="60" height="56"></canvas><img id="unit-preview-image" alt=""></div>
</div>
<div id="unit-info"><strong id="unit-name"></strong><span id="unit-life"></span><span id="unit-extra"></span><span id="unit-effects"></span><span id="unit-detector"></span><div id="unit-supply"></div><span id="unit-kills"></span><div id="unit-details"></div><div id="unit-health"><i></i></div></div>
