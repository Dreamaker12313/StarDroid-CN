<div id="campaign-panel" hidden>
  <div id="campaign-progress"></div>
  <div id="campaign-ai-warning" hidden></div>
  <div id="campaign-cinematic" hidden>Transmission…</div>
  <div id="campaign-subtitle" hidden></div>
</div>
<div id="campaign-objectives" hidden>
  <button id="campaign-objectives-close">Close</button>
  <h3>Mission objectives</h3><div id="campaign-objectives-text"></div>
  <p id="campaign-ai-status"></p>
  <p>Touch: hold then drag to select a group. Tap the minimap to travel across the map.</p>
</div>
<div id="campaign-briefing" hidden>
  <div id="brief-room" aria-label="Terran mission briefing">
    <img id="brief-background" alt="">
    <canvas id="brief-portrait" class="brief-original-portrait" width="60" height="56" hidden></canvas>
    <canvas id="brief-portrait-1" class="brief-original-portrait" width="60" height="56" hidden></canvas>
    <canvas id="brief-portrait-2" class="brief-original-portrait" width="60" height="56" hidden></canvas>
    <canvas id="brief-portrait-3" class="brief-original-portrait" width="60" height="56" hidden></canvas>
    <div id="brief-text" aria-live="polite"></div>
    <div id="brief-objectives-heading"></div><div id="brief-goals"></div>
    <button id="brief-start" class="brief-original-button" aria-label="Start"></button>
    <button id="brief-cancel" class="brief-original-button" aria-label="Cancel"></button>
    <button id="brief-replay" class="brief-original-button" aria-label="Replay"></button>
  </div>
</div>
